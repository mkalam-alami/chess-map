name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**'] # nothing deployable changed: spare the run (scripts/ship.sh knows)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push supersedes a run still testing. The deploy job has its own group below: it is never cancelled half way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One build per run: the e2e tests run against the very dist that is deployed afterwards.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium # downloads the browser only when the cache missed
      - run: npm run e2e # CI=true: serves the dist built above instead of rebuilding it
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
